name: CrisisBench sharded canonical collection
on:
  pull_request:
    paths:
      - .github/canonical-sharded-trigger.txt
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - {shard: gpt41-a, model: gpt41, domains: public_health,cyber_incident, task_ids: '', cap: '0.25'}
          - {shard: gpt41-b, model: gpt41, domains: critical_infrastructure,disaster_response, task_ids: '', cap: '0.25'}
          - {shard: gpt41-c, model: gpt41, domains: crisis_communication,public_governance, task_ids: '', cap: '0.25'}
          - {shard: gemini-a, model: gemini, domains: public_health,cyber_incident, task_ids: '', cap: '0.12'}
          - {shard: gemini-b, model: gemini, domains: critical_infrastructure,disaster_response, task_ids: '', cap: '0.12'}
          - {shard: gemini-c, model: gemini, domains: crisis_communication,public_governance, task_ids: '', cap: '0.12'}
          - {shard: deepseek-a, model: deepseek, domains: public_health,cyber_incident, task_ids: '', cap: '0.20'}
          - {shard: deepseek-b, model: deepseek, domains: critical_infrastructure,disaster_response, task_ids: '', cap: '0.20'}
          - {shard: deepseek-c, model: deepseek, domains: crisis_communication,public_governance, task_ids: '', cap: '0.20'}
          - {shard: mistral-a, model: mistral, domains: public_health,cyber_incident, task_ids: '', cap: '0.12'}
          - {shard: mistral-b, model: mistral, domains: critical_infrastructure,disaster_response, task_ids: '', cap: '0.12'}
          - {shard: mistral-c, model: mistral, domains: crisis_communication,public_governance, task_ids: '', cap: '0.12'}
          - {shard: gpt54-frontier, model: gpt54, domains: '', task_ids: 'CB-PH-001,CB-CY-001,CB-CI-001,CB-DR-001,CB-CC-001,CB-PG-001', cap: '0.75'}
          - {shard: claude-frontier, model: claude, domains: '', task_ids: 'CB-PH-001,CB-CY-001,CB-CI-001,CB-DR-001,CB-CC-001,CB-PG-001', cap: '1.35'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run canonical shard
        id: shard
        continue-on-error: true
        run: >-
          python scripts/run_shard.py
          --shard-id '${{ matrix.shard }}'
          --model-key '${{ matrix.model }}'
          --domains '${{ matrix.domains }}'
          --task-ids '${{ matrix.task_ids }}'
          --max-cost '${{ matrix.cap }}'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-shard-${{ matrix.shard }}
          path: results/private/shards/
          retention-days: 30
  aggregate:
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: canonical-shard-*
          path: results/collected_shards
          merge-multiple: true
      - name: Merge, verify, analyse, and audit cost
        id: merge
        continue-on-error: true
        run: python scripts/merge_shards.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crisisbench-canonical-complete-${{ github.run_id }}
          path: |
            results/private/canonical.jsonl
            results/v1/summary.json
            results/v1/cost_summary.json
          retention-days: 90
