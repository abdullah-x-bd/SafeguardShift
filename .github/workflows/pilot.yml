name: Noncanonical OpenRouter pilot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/pilot-pr-trigger.txt
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/preflight.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Run three-trajectory pilot
        id: pilot
        continue-on-error: true
        run: python scripts/run_pilot.py --limit 3 --max-cost 0.02 --output results/private/pilot.jsonl
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Summarize pilot
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('results/private/pilot.jsonl')
          rows=[json.loads(x) for x in src.read_text().splitlines() if x.strip()] if src.exists() else []
          turns=[len(r.get('trajectory',[])) for r in rows]
          spend=max([float(r.get('cumulative_cost_usd',0.0)) for r in rows], default=0.0)
          out={
            'status':'PASS' if len(rows)==3 else 'PARTIAL_OR_FAILED',
            'trajectories':len(rows),
            'cumulative_cost_usd':spend,
            'mean_turns':sum(turns)/len(turns) if turns else None,
            'max_turns':max(turns) if turns else None,
            'projected_780_cost_usd':(spend/len(rows)*780) if rows else None,
            'models':sorted({r.get('model') for r in rows}),
            'providers':sorted({r.get('provider') for r in rows}),
          }
          Path('results/pilot_readback.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crisisbench-noncanonical-pilot-${{ github.run_id }}
          path: |
            results/private/pilot.jsonl
            results/pilot_readback.json
          retention-days: 30
