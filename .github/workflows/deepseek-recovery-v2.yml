name: SafeguardShift V2 finalized DeepSeek recovery
on:
  pull_request:
    paths:
      - 'v2/RUN_DEEPSEEK_RECOVERY'
permissions:
  contents: read
jobs:
  recover:
    if: github.head_ref == 'run/v2-backbone-recovery'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {domain: public_health, cap: 0.16}
          - {domain: critical_infrastructure, cap: 0.25}
          - {domain: cyber_incident, cap: 0.29}
          - {domain: disaster_response, cap: 0.28}
          - {domain: public_governance, cap: 0.29}
          - {domain: crisis_communication, cap: 0.20}
    runs-on: ubuntu-latest
    environment: safeguardshift-v2-canonical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts_v2/check_freeze.py
      - run: python scripts_v2/check_construct_validation.py results/v2/construct_validation.json
      - run: python scripts_v2/run_exact_recovery.py --deepseek-finalized-domain ${{ matrix.domain }} --max-cost ${{ matrix.cap }} --output results/private/v2/deepseek-recovery-${{ matrix.domain }}.jsonl
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-recovery-${{ matrix.domain }}
          path: results/private/v2/deepseek-recovery-${{ matrix.domain }}.jsonl
          retention-days: 90
