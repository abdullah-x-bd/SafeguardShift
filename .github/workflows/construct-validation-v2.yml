name: SafeguardShift V2 construct validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/RUN_CONSTRUCT_VALIDATION'
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'run/v2-construct-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: safeguardshift verify
      - run: python scripts_v2/run_oracle.py
      - run: python scripts_v2/check_freeze.py
      - name: Run final qualified construct panel
        run: python scripts_v2/run_construct_validation.py --max-cost 0.80 --raw-output results/private/v2/construct_validation_raw.jsonl --summary-output results/v2/construct_validation.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safeguardshift-v2-construct-validation
          path: |
            results/private/v2/construct_validation_raw.jsonl
            results/v2/construct_validation.json
          retention-days: 90
