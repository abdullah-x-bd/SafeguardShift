name: SafeguardShift V2 frontier diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/RUN_FRONTIER_RECOVERY'
permissions:
  contents: read
jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'run/v2-frontier-recovery'
    runs-on: ubuntu-latest
    outputs:
      gpt_cap: ${{ steps.budget.outputs.gpt_cap }}
      claude_cap: ${{ steps.budget.outputs.claude_cap }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: safeguardshift verify
      - run: python scripts_v2/run_oracle.py
      - run: python scripts_v2/check_freeze.py
      - run: python scripts_v2/check_construct_validation.py results/v2/construct_validation.json
      - id: budget
        shell: bash
        run: |
          python - <<'PY'
          import os
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("gpt_cap=0.62\n")
              f.write("claude_cap=1.39\n")
          PY
      - name: Preflight both frontier routes
        run: python scripts_v2/provider_preflight_frontier.py --max-cost 0.09
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  gpt54:
    needs: gate
    runs-on: ubuntu-latest
    environment: safeguardshift-v2-canonical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts_v2/run_frontier_diagnostic.py --model-index 0 --max-cost ${{ needs.gate.outputs.gpt_cap }} --output results/private/v2/frontier-gpt54.jsonl
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-frontier-gpt54
          path: results/private/v2/
          retention-days: 90
  claude:
    needs: gate
    runs-on: ubuntu-latest
    environment: safeguardshift-v2-canonical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts_v2/run_frontier_diagnostic.py --model-index 1 --max-cost ${{ needs.gate.outputs.claude_cap }} --output results/private/v2/frontier-claude.jsonl
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-frontier-claude
          path: results/private/v2/
          retention-days: 90
  aggregate:
    if: always()
    needs: [gpt54, claude]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-frontier-*
          path: results/private/v2
          merge-multiple: true
      - name: Verify and analyse frontier diagnostic
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from safeguardshift.analysis import analyse_frontier
          files=sorted(Path('results/private/v2').glob('frontier-*.jsonl'))
          rows=[]
          for p in files:
              rows.extend(json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip())
          combined=Path('results/private/v2/canonical-frontier.jsonl')
          combined.parent.mkdir(parents=True,exist_ok=True)
          with combined.open('w',encoding='utf-8') as f:
              for r in rows:f.write(json.dumps(r,sort_keys=True)+'\n')
          result=analyse_frontier(rows)
          Path('results/v2').mkdir(parents=True,exist_ok=True)
          Path('results/v2/frontier_summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print({'rows':len(rows),'status':result['status']})
          raise SystemExit(0 if result['status']=='PASS' else 2)
          PY
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safeguardshift-v2-frontier-combined
          path: |
            results/private/v2/canonical-frontier.jsonl
            results/private/v2/frontier-*.jsonl
            results/v2/frontier_summary.json
          retention-days: 90
