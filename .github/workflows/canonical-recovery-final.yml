name: CrisisBench final Gemini Mistral recovery
on:
  pull_request:
    paths:
      - .github/canonical-recovery-final-trigger.txt
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {shard: gemini-health-final, model: gemini, domain: public_health, cap: '0.12'}
          - {shard: gemini-cyber-final, model: gemini, domain: cyber_incident, cap: '0.12'}
          - {shard: gemini-infra-final, model: gemini, domain: critical_infrastructure, cap: '0.12'}
          - {shard: gemini-disaster-final, model: gemini, domain: disaster_response, cap: '0.12'}
          - {shard: gemini-comms-final, model: gemini, domain: crisis_communication, cap: '0.12'}
          - {shard: gemini-governance-final, model: gemini, domain: public_governance, cap: '0.12'}
          - {shard: mistral-health-final, model: mistral, domain: public_health, cap: '0.05'}
          - {shard: mistral-cyber-final, model: mistral, domain: cyber_incident, cap: '0.05'}
          - {shard: mistral-infra-final, model: mistral, domain: critical_infrastructure, cap: '0.05'}
          - {shard: mistral-disaster-final, model: mistral, domain: disaster_response, cap: '0.05'}
          - {shard: mistral-comms-final, model: mistral, domain: crisis_communication, cap: '0.05'}
          - {shard: mistral-governance-final, model: mistral, domain: public_governance, cap: '0.05'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run accepted recovery shard
        id: shard
        continue-on-error: true
        run: >-
          python scripts/run_shard.py
          --shard-id '${{ matrix.shard }}'
          --model-key '${{ matrix.model }}'
          --domains '${{ matrix.domain }}'
          --max-cost '${{ matrix.cap }}'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-recovery-${{ matrix.shard }}
          path: results/private/shards/
          retention-days: 30
