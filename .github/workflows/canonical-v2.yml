name: SafeguardShift V2 canonical collection
on:
  workflow_dispatch:
    inputs:
      total_budget_usd:
        description: Explicit newly approved total OpenRouter ceiling including preflight and all 12 backbone shards
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: safeguardshift verify
      - run: python scripts_v2/run_oracle.py
      - run: python scripts_v2/check_freeze.py
      - run: python scripts_v2/validate_expert_reviews.py v2/validation/expert_reviews.csv
      - id: budget
        shell: bash
        run: |
          python - <<'PY'
          import os
          total = float("${{ inputs.total_budget_usd }}")
          if total <= 0:
              raise SystemExit("A positive explicit total budget approval is required.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"preflight_cap={total * 0.01}\n")
          PY
      - name: Preflight all four backbone routes
        run: python scripts_v2/provider_preflight.py --max-cost ${{ steps.budget.outputs.preflight_cap }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  collect:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model_index: 0, replicate: 1, budget_share: 0.1270}
          - {model_index: 0, replicate: 2, budget_share: 0.1270}
          - {model_index: 0, replicate: 3, budget_share: 0.1270}
          - {model_index: 1, replicate: 1, budget_share: 0.0646}
          - {model_index: 1, replicate: 2, budget_share: 0.0646}
          - {model_index: 1, replicate: 3, budget_share: 0.0646}
          - {model_index: 2, replicate: 1, budget_share: 0.0943}
          - {model_index: 2, replicate: 2, budget_share: 0.0943}
          - {model_index: 2, replicate: 3, budget_share: 0.0943}
          - {model_index: 3, replicate: 1, budget_share: 0.0439}
          - {model_index: 3, replicate: 2, budget_share: 0.0439}
          - {model_index: 3, replicate: 3, budget_share: 0.0439}
    runs-on: ubuntu-latest
    environment: safeguardshift-v2-canonical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Compute shard hard cap
        id: cap
        shell: bash
        run: |
          CAP=$(python - <<'PY'
          print(float("${{ inputs.total_budget_usd }}") * float("${{ matrix.budget_share }}"))
          PY
          )
          echo "value=$CAP" >> "$GITHUB_OUTPUT"
      - name: Run backbone shard
        run: python scripts_v2/run_canonical.py --model-index ${{ matrix.model_index }} --replicate ${{ matrix.replicate }} --max-cost ${{ steps.cap.outputs.value }} --output results/private/v2/model${{ matrix.model_index }}-rep${{ matrix.replicate }}.jsonl
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-model${{ matrix.model_index }}-rep${{ matrix.replicate }}
          path: results/private/v2/
          retention-days: 90
