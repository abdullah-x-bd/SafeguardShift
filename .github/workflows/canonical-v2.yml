name: SafeguardShift V2 canonical collection
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/RUN_CANONICAL'
permissions:
  contents: read
jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'run/v2-canonical'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: safeguardshift verify
      - run: python scripts_v2/run_oracle.py
      - run: python scripts_v2/check_freeze.py
      - run: python scripts_v2/check_construct_validation.py results/v2/construct_validation.json
      - name: Preflight all four backbone routes
        run: python scripts_v2/provider_preflight.py --max-cost 0.059
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  collect:
    needs: gate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        model_index: [0, 1, 2, 3]
        replicate: [1, 2, 3]
        domain: [public_health, critical_infrastructure, cyber_incident, disaster_response, public_governance, crisis_communication]
    runs-on: ubuntu-latest
    environment: safeguardshift-v2-canonical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Compute domain-shard hard cap
        id: cap
        shell: bash
        run: |
          CAP=$(python - <<'PY'
          shares={0:0.1270,1:0.0646,2:0.0943,3:0.0439}
          print(5.90*shares[int("${{ matrix.model_index }}")]/6.0)
          PY
          )
          echo "value=$CAP" >> "$GITHUB_OUTPUT"
      - name: Run backbone domain shard
        run: python scripts_v2/run_canonical.py --model-index ${{ matrix.model_index }} --replicate ${{ matrix.replicate }} --domain ${{ matrix.domain }} --max-cost ${{ steps.cap.outputs.value }} --output results/private/v2/model${{ matrix.model_index }}-rep${{ matrix.replicate }}-${{ matrix.domain }}.jsonl
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-model${{ matrix.model_index }}-rep${{ matrix.replicate }}-${{ matrix.domain }}
          path: results/private/v2/
          retention-days: 90
  aggregate:
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-model*
          path: results/private/v2
          merge-multiple: true
      - name: Build combined backbone ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path('results/private/v2').glob('model*-rep*-*.jsonl'))
          out=Path('results/private/v2/canonical-backbone.jsonl')
          with out.open('w',encoding='utf-8') as w:
              for p in files:
                  for line in p.read_text(encoding='utf-8').splitlines():
                      if line.strip(): w.write(line+'\n')
          print({'shard_files':len(files),'rows':sum(1 for _ in out.open(encoding='utf-8'))})
          PY
      - name: Verify and analyse backbone
        run: python scripts_v2/analyse_canonical.py --backbone-glob 'results/private/v2/model*-rep*-*.jsonl' --frontier-glob 'results/private/v2/__no_frontier__.jsonl' --backbone-output results/v2/backbone_summary.json --frontier-output results/v2/frontier_not_run.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safeguardshift-v2-backbone-combined
          path: |
            results/private/v2/canonical-backbone.jsonl
            results/private/v2/model*-rep*-*.jsonl
            results/v2/backbone_summary.json
          retention-days: 90
