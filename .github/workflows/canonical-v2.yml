name: SafeguardShift V2 canonical collection
on:
  workflow_dispatch:
    inputs:
      total_budget_usd:
        description: Explicit newly approved total OpenRouter ceiling including preflight and all 72 domain shards
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: safeguardshift verify
      - run: python scripts_v2/run_oracle.py
      - run: python scripts_v2/check_freeze.py
      - run: python scripts_v2/check_construct_validation.py results/v2/construct_validation.json
      - id: budget
        shell: bash
        run: |
          python - <<'PY'
          import os
          total = float("${{ inputs.total_budget_usd }}")
          if total <= 0:
              raise SystemExit("A positive explicit total budget approval is required.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"preflight_cap={total * 0.01}\n")
          PY
      - name: Preflight all four backbone routes
        run: python scripts_v2/provider_preflight.py --max-cost ${{ steps.budget.outputs.preflight_cap }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  collect:
    needs: gate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        model_index: [0, 1, 2, 3]
        replicate: [1, 2, 3]
        domain: [public_health, critical_infrastructure, cyber_incident, disaster_response, public_governance, crisis_communication]
    runs-on: ubuntu-latest
    environment: safeguardshift-v2-canonical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Compute domain-shard hard cap
        id: cap
        shell: bash
        run: |
          CAP=$(python - <<'PY'
          total=float("${{ inputs.total_budget_usd }}")
          shares={0:0.1270,1:0.0646,2:0.0943,3:0.0439}
          print(total*shares[int("${{ matrix.model_index }}")]/6.0)
          PY
          )
          echo "value=$CAP" >> "$GITHUB_OUTPUT"
      - name: Run backbone domain shard
        run: python scripts_v2/run_canonical.py --model-index ${{ matrix.model_index }} --replicate ${{ matrix.replicate }} --domain ${{ matrix.domain }} --max-cost ${{ steps.cap.outputs.value }} --output results/private/v2/model${{ matrix.model_index }}-rep${{ matrix.replicate }}-${{ matrix.domain }}.jsonl
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-model${{ matrix.model_index }}-rep${{ matrix.replicate }}-${{ matrix.domain }}
          path: results/private/v2/
          retention-days: 90
