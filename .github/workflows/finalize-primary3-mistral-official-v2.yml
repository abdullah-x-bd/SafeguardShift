name: SafeguardShift V2 official-Mistral residual completion
on:
  pull_request:
    paths:
      - 'v2/RUN_PRIMARY3_MISTRAL_OFFICIAL_FINAL'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.head_ref == 'run/v2-primary3-mistral-official-final'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - shard: mistral_ci
            task_prefix: 'SS-CI-'
            max_cost: '0.20'
          - shard: mistral_cc
            task_prefix: 'SS-CC-'
            max_cost: '0.14'
          - shard: mistral_dr
            task_prefix: 'SS-DR-'
            max_cost: '0.14'
          - shard: mistral_cy
            task_prefix: 'SS-CY-'
            max_cost: '0.13'
          - shard: mistral_ph
            task_prefix: 'SS-PH-'
            max_cost: '0.13'
          - shard: mistral_pg
            task_prefix: 'SS-PG-'
            max_cost: '0.06'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts_v2/check_freeze.py
      - run: python scripts_v2/check_construct_validation.py results/v2/construct_validation.json
      - name: Download fixed 2,972-cell baseline and residual manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prior
          gh run download 31467929875 -n safeguardshift-v2-primary3-DONE --dir prior
          test -f prior/results/private/v2/canonical-primary3.jsonl
          test -f prior/results/private/v2/primary3-missing-after-final.json
          python - <<'PY'
          import json
          rows=json.load(open('prior/results/private/v2/primary3-missing-after-final.json'))
          assert len(rows)==268, len(rows)
          assert all(r['model']=='mistralai/mistral-small-3.2-24b-instruct' for r in rows)
          print('FIXED BASELINE 2972 + RESIDUAL 268 PASS')
          PY
      - name: Recover exact residual shard on official Mistral provider
        shell: bash
        run: |
          python scripts_v2/run_primary_missing_mistral_official.py \
            --cells prior/results/private/v2/primary3-missing-after-final.json \
            --task-prefix '${{ matrix.task_prefix }}' \
            --max-cost ${{ matrix.max_cost }} \
            --output results/private/v2/official-${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primary3-official-${{ matrix.shard }}
          path: results/private/v2/official-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
          retention-days: 90

  finalize:
    if: always()
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: safeguardshift verify
      - run: python scripts_v2/run_oracle.py
      - run: python scripts_v2/check_freeze.py
      - run: python scripts_v2/check_construct_validation.py results/v2/construct_validation.json
      - name: Download fixed primary baseline and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming/baseline incoming/deepseek_original incoming/deepseek_old incoming/deepseek_robust results/private/v2
          gh run download 31467929875 -n safeguardshift-v2-primary3-DONE --dir incoming/baseline
          test -f incoming/baseline/results/private/v2/canonical-primary3.jsonl
          test -f incoming/baseline/results/private/v2/canonical-frontier.jsonl
          cp incoming/baseline/results/private/v2/canonical-frontier.jsonl results/private/v2/canonical-frontier.jsonl
          gh run download 31456685835 -p 'v2-model2-*' --dir incoming/deepseek_original || true
          gh run download 31459468549 --dir incoming/deepseek_old || true
          gh run download 31461817984 --dir incoming/deepseek_robust || true
      - uses: actions/download-artifact@v4
        with:
          pattern: primary3-official-*
          path: incoming/official
          merge-multiple: true
      - name: Assemble and require exact 3,240-cell primary matrix
        shell: bash
        run: |
          python scripts_v2/assemble_primary3.py \
            --source accepted_baseline=incoming/baseline \
            --source official_mistral_residual=incoming/official \
            --output results/private/v2/canonical-primary3.jsonl \
            --missing-output results/private/v2/primary3-missing-final.json \
            --report-output results/v2/primary3_canonical_verification.json
          python - <<'PY'
          import json
          r=json.load(open('results/v2/primary3_canonical_verification.json'))
          if r['accepted_cells'] != 3240 or r['missing_cells'] != 0:
              raise SystemExit(f"primary matrix incomplete: {r}")
          print('PRIMARY BACKBONE 3240/3240 PASS')
          PY
      - name: Preserve DeepSeek as provider/interface diagnostic
        run: |
          python scripts_v2/assemble_deepseek_diagnostic.py \
            --source original=incoming/deepseek_original \
            --source first_recovery=incoming/deepseek_old \
            --source robust_recovery=incoming/deepseek_robust \
            --output results/private/v2/deepseek-provider-diagnostic.jsonl \
            --report-output results/v2/deepseek_provider_diagnostic.json
      - name: Run frozen behavioral analysis
        run: |
          python scripts_v2/analyse_primary3.py \
            --backbone-glob results/private/v2/canonical-primary3.jsonl \
            --frontier-glob results/private/v2/canonical-frontier.jsonl \
            --backbone-output results/v2/primary3_summary.json \
            --frontier-output results/v2/frontier_summary.json
      - name: Record final provenance
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          names=[
            'results/private/v2/canonical-primary3.jsonl',
            'results/private/v2/canonical-frontier.jsonl',
            'results/private/v2/deepseek-provider-diagnostic.jsonl',
            'results/private/v2/primary3-missing-final.json',
            'results/v2/primary3_canonical_verification.json',
            'results/v2/primary3_summary.json',
            'results/v2/frontier_summary.json',
            'results/v2/deepseek_provider_diagnostic.json',
            'v2/amendments/005_primary_estimand_provider_attrition.md',
            'v2/amendments/006_residual_transport_retry.md',
            'v2/amendments/007_mistral_transport_provider_substitution.md',
          ]
          files={}
          for name in names:
              p=Path(name)
              if p.exists():
                  files[name]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size}
          payload={
            'protocol':'safeguardshift-v2.0.0',
            'primary_estimand':'3 backbone models x 72 tasks x 5 conditions x 3 replicates = 3240 cells',
            'primary_models':['openai/gpt-4.1-mini','google/gemini-2.5-flash-lite','mistralai/mistral-small-3.2-24b-instruct'],
            'baseline_source_run':31467929875,
            'baseline_accepted_cells':2972,
            'residual_expected_cells':268,
            'mistral_residual_provider':'mistral',
            'mistral_original_provider':'venice',
            'provider_substitution_scope':'only keys absent from the fixed 2,972-cell baseline; no accepted cell replaced',
            'residual_caps_usd':{'mistral_ci':0.20,'mistral_cc':0.14,'mistral_dr':0.14,'mistral_cy':0.13,'mistral_ph':0.13,'mistral_pg':0.06,'total':0.80},
            'deepseek_role':'provider/interface reliability diagnostic only; not pooled into primary behavioral estimand',
            'amendments':['v2/amendments/005_primary_estimand_provider_attrition.md','v2/amendments/006_residual_transport_retry.md','v2/amendments/007_mistral_transport_provider_substitution.md'],
            'files':files,
          }
          Path('results/v2/primary3_final_provenance.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: safeguardshift-v2-primary3-COMPLETE
          path: |
            results/private/v2/canonical-primary3.jsonl
            results/private/v2/canonical-frontier.jsonl
            results/private/v2/deepseek-provider-diagnostic.jsonl
            results/private/v2/primary3-missing-final.json
            results/v2/primary3_canonical_verification.json
            results/v2/primary3_summary.json
            results/v2/frontier_summary.json
            results/v2/deepseek_provider_diagnostic.json
            results/v2/primary3_final_provenance.json
            v2/amendments/005_primary_estimand_provider_attrition.md
            v2/amendments/006_residual_transport_retry.md
            v2/amendments/007_mistral_transport_provider_substitution.md
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: safeguardshift-v2-primary3-OFFICIAL-MISTRAL-INCOMPLETE
          path: |
            results/private/v2/canonical-primary3.jsonl
            results/private/v2/primary3-missing-final.json
            results/v2/primary3_canonical_verification.json
          if-no-files-found: warn
          retention-days: 90
