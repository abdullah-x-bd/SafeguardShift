name: Frontier trajectory cost pilot
on:
  pull_request:
    paths:
      - .github/frontier-cost-trigger.txt
permissions:
  contents: read
jobs:
  cost-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run GPT-5.4 and Claude full-trajectory calibration
        continue-on-error: true
        run: python scripts/frontier_cost_pilot.py --max-cost 0.15
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crisisbench-frontier-cost-${{ github.run_id }}
          path: |
            results/private/frontier_cost_pilot.jsonl
            results/frontier_cost_summary.json
          retention-days: 30
