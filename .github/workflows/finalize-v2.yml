name: SafeguardShift V2 final assembly and exact recovery
on:
  pull_request:
    paths:
      - 'v2/RUN_FINALIZE'
permissions:
  contents: read
  actions: read
jobs:
  finalize:
    if: github.head_ref == 'run/v2-finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: safeguardshift verify
      - run: python scripts_v2/run_oracle.py
      - run: python scripts_v2/check_freeze.py
      - run: python scripts_v2/check_construct_validation.py results/v2/construct_validation.json
      - name: Wait for designated source artifacts
        shell: bash
        run: |
          set -euo pipefail
          wait_for_artifacts() {
            local run_id="$1"
            local minimum="$2"
            local label="$3"
            for i in $(seq 1 240); do
              count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '.total_count')
              echo "$label artifacts: $count / >=$minimum"
              if [ "$count" -ge "$minimum" ]; then
                return 0
              fi
              sleep 30
            done
            echo "Timed out waiting for $label artifacts" >&2
            return 1
          }
          wait_for_artifacts 31456685835 72 original
          wait_for_artifacts 31459468529 6 gemini_recovery
          wait_for_artifacts 31459468549 6 deepseek_recovery
          wait_for_artifacts 31460302065 6 mistral_recovery
          wait_for_artifacts 31456858244 3 frontier_recovery
      - name: Download designated source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming/original incoming/gemini incoming/deepseek incoming/mistral incoming/frontier
          gh run download 31456685835 --dir incoming/original
          gh run download 31459468529 --dir incoming/gemini
          gh run download 31459468549 --dir incoming/deepseek
          gh run download 31460302065 --dir incoming/mistral
          gh run download 31456858244 -n safeguardshift-v2-frontier-combined --dir incoming/frontier
          frontier=$(find incoming/frontier -type f -name 'canonical-frontier.jsonl' | head -n 1)
          test -n "$frontier"
          mkdir -p results/private/v2
          cp "$frontier" results/private/v2/canonical-frontier.jsonl
      - name: Assemble all accepted cells before final recovery
        run: |
          python scripts_v2/assemble_v2.py \
            --source original=incoming/original \
            --source gemini_recovery=incoming/gemini \
            --source deepseek_recovery=incoming/deepseek \
            --source mistral_recovery=incoming/mistral \
            --output results/private/v2/canonical-backbone-pre-final.jsonl \
            --missing-output results/private/v2/missing-before-final.json \
            --report-output results/private/v2/assembly-before-final.json
      - name: Recover exact GPT-4.1 missing cells
        continue-on-error: true
        run: python scripts_v2/run_final_missing.py --cells results/private/v2/missing-before-final.json --model-index 0 --max-cost 0.04 --output results/private/v2/final-recovery-gpt41.jsonl
      - name: Recover exact Mistral missing cells
        continue-on-error: true
        run: python scripts_v2/run_final_missing.py --cells results/private/v2/missing-before-final.json --model-index 3 --max-cost 0.22 --output results/private/v2/final-recovery-mistral.jsonl
      - name: Recover exact Gemini missing cells
        continue-on-error: true
        run: python scripts_v2/run_final_missing.py --cells results/private/v2/missing-before-final.json --model-index 1 --max-cost 0.01 --output results/private/v2/final-recovery-gemini.jsonl
      - name: Recover exact DeepSeek missing cells with malformed-provider retry
        continue-on-error: true
        run: python scripts_v2/run_final_missing.py --cells results/private/v2/missing-before-final.json --model-index 2 --max-cost 0.33 --empty-retries 8 --output results/private/v2/final-recovery-deepseek.jsonl
      - name: Assemble final backbone
        run: |
          mkdir -p incoming/final
          cp results/private/v2/final-recovery-*.jsonl incoming/final/ 2>/dev/null || true
          python scripts_v2/assemble_v2.py \
            --source original=incoming/original \
            --source gemini_recovery=incoming/gemini \
            --source deepseek_recovery=incoming/deepseek \
            --source mistral_recovery=incoming/mistral \
            --source final_exact_recovery=incoming/final \
            --output results/private/v2/canonical-backbone.jsonl \
            --missing-output results/private/v2/missing-after-final.json \
            --report-output results/v2/canonical_verification.json
          python - <<'PY'
          import json
          r=json.load(open('results/v2/canonical_verification.json'))
          if r['accepted_cells'] != 4320 or r['missing_cells'] != 0 or r['unexpected_cells'] != 0:
              raise SystemExit(f"canonical matrix incomplete: {r}")
          print('BACKBONE 4320/4320 PASS')
          PY
      - name: Run frozen analysis only on complete matrix
        run: python scripts_v2/analyse_canonical.py --backbone-glob results/private/v2/canonical-backbone.jsonl --frontier-glob results/private/v2/canonical-frontier.jsonl --backbone-output results/v2/backbone_summary.json --frontier-output results/v2/frontier_summary.json
      - name: Record final provenance manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=['results/private/v2/canonical-backbone.jsonl','results/private/v2/canonical-frontier.jsonl','results/v2/canonical_verification.json','results/v2/backbone_summary.json','results/v2/frontier_summary.json','results/private/v2/missing-before-final.json','results/private/v2/missing-after-final.json']
          files={}
          for name in paths:
              p=Path(name)
              if p.exists(): files[name]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size}
          payload={'protocol':'safeguardshift-v2.0.0','source_runs':{'original':31456685835,'gemini_recovery':31459468529,'deepseek_recovery':31459468549,'mistral_recovery':31460302065,'frontier':31456858244},'acceptance_policy':'first valid expected cell wins by fixed source priority; recoveries fill only previously missing cells','final_recovery_caps_usd':{'gpt41':0.04,'gemini':0.01,'deepseek':0.33,'mistral':0.22,'total':0.60},'provider_empty_choices_policy':'retry identical request only when HTTP-success provider payload has no choices','files':files}
          Path('results/v2/final_provenance.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safeguardshift-v2-final-evidence
          path: |
            results/private/v2/canonical-backbone*.jsonl
            results/private/v2/canonical-frontier.jsonl
            results/private/v2/final-recovery-*.jsonl
            results/private/v2/missing-*.json
            results/private/v2/assembly-before-final.json
            results/v2/canonical_verification.json
            results/v2/backbone_summary.json
            results/v2/frontier_summary.json
            results/v2/final_provenance.json
          retention-days: 90
