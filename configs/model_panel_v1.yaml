note: CrisisBench prompts are synthetic and contain no user data. The Mistral route was amended pre-data from Mistral to DeepInfra after the original endpoint returned no live route. GPT-5 and Claude Sonnet 5 omit temperature because it is not in their current OpenRouter-supported parameter set. Fallbacks remain disabled.
