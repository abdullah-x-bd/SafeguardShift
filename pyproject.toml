[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="safeguardshift"
version="2.0.0"
description="Controlled agent benchmark for institutional safeguard sensitivity and resilience"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
authors=[{name="Abdullah X"}]
dependencies=[]

[project.optional-dependencies]
dev=["pytest>=8"]

[project.scripts]
safeguardshift="safeguardshift.cli:main"

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests_v2"]
addopts="-q"
